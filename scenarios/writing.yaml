name: writing
title: Writing
summary: Write and edit prose, scripts, social content, and knowledge or meeting notes.

includes: []

skills:
  - source: anthropics/skills
    why: "Collaborative drafting and revision of substantial text; file generation belongs in documents."
    names:
      - doc-coauthoring

  - source: anthropics/skills
    why: "Only when producing structured internal company communications or recurring team updates."
    names:
      - internal-comms

  - source: openai/skills
    why: "Capture knowledge or prepare meeting materials in an existing Notion workspace; requires connector access. Research and specification implementation have separate task categories."
