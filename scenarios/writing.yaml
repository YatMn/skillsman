      - notion-meeting-intelligence

  - source: alchaincyf/huashu-skills
    why: "Preferred proofreading candidate for personal writing, retained based on the maintainer’s positive use experience; preserve the user’s intended meaning and voice."
    names:
      - huashu-proofreading

  - source: alchaincyf/huashu-skills
    why: "Article editing, topic exploration, spoken scripts and speech coaching; choose the method matching the writing task."
    names:
      - huashu-article-edit
      - huashu-topic-gen
      - huashu-script-polish
      - huashu-speech-coach

  - source: alchaincyf/huashu-skills
    why: "Platform-specific social and video content; inspect required APIs and local resources, including Gemini for video analysis."
    names:
      - huashu-article-to-x
      - huashu-douyin-script
      - huashu-video-check
      - huashu-video-outline

  - source: alchaincyf/huashu-skills
    why: "Save reusable prompts only when a local prompt library is part of the task; inspect the expected storage layout."
